name: Build and Deploy .NET 8 Console App

on:
  push:
    branches:
      - master  # Trigger deployment when pushing to the master branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Use .NET 8 SDK

      - name: Restore dependencies
        run: |
          cd FirstAPI
          dotnet restore

      - name: Build the application
        run: |
          cd FirstAPI
          dotnet build --configuration Release

      - name: Publish the application
        run: |
          cd FirstAPI
          dotnet publish --configuration Release --output ./publish

          # Check if the publish directory exists
          if [ ! -d "./publish" ]; then
            echo "Error: Publish directory does not exist!"
            exit 1
          fi

      - name: List the contents of the publish directory
        run: |
          ls -R ./FirstAPI/publish

      - name: Set up SSH key for deployment
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_TEST }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Set Git remote URL to SSH
        run: |
          git remote set-url origin git@github.com:imnilesh17/Projects.git
          git fetch origin

      - name: Deploy to GitHub Pages via SSH
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch you want to deploy to
          folder: FirstAPI/publish  # Folder containing the generated static files
          token: ${{ secrets.SSH_PRIVATE_KEY_TEST }}  # SSH private key for authentication
          git-config-name: 'GitHub Actions'
          git-config-email: 'nilesh.nk171991@gmail.com'
          force: true  # Force push in case of any conflicts
