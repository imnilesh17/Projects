name: Build and Deploy .NET 8 Console App

on:
  push:
    branches:
      - master  # Trigger deployment when pushing to the master branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Use .NET 8 SDK

      - name: Restore dependencies
        run: |
          # Change directory to the project folder and restore dependencies
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet restore

      - name: Build the application
        run: |
          # Change directory to the project folder and build the application
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet build --configuration Release

      - name: Publish the application
        run: |
          # Change directory to the project folder and publish the application
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet publish --configuration Release --output ./publish

          # Check if the publish directory exists
          if [ ! -d "./publish" ]; then
            echo "Error: Publish directory does not exist!"
            exit 1
          fi

      - name: List the contents of the publish directory
        run: |
          # Verify the contents of the publish directory to ensure files are present
          ls -R ./FirstAPI/publish

      - name: Deploy to GitHub Pages using GH_TOKEN
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch you want to deploy to
          folder: FirstAPI/publish  # Ensure this points to the correct folder after the build
          token: ${{ secrets.GH_TOKEN }}  # Use the GH_TOKEN secret here for authentication
          git-config-name: 'GitHub Actions'
          git-config-email: 'nilesh.nk171991@gmail.com'
          force: true  # Force push in case of any conflicts
          repository-name: imnilesh17/Projects  # Make sure the repository name is specified correctly
