name: Build and Deploy .NET 8 Console App

on:
  push:
    branches:
      - master  # Trigger deployment when pushing to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Use .NET 8 SDK
        
      - name: Restore dependencies
        run : |
          # Change directory to the project folder and restore dependencies
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet restore

      - name: Build the application
        run: |
          # Change directory to the project folder and restore dependencies
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet build --configuration Release

      - name: Publish the application
        run: |
          # Change directory to the project folder and restore dependencies
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet publish --configuration Release --output ./publish
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.1.1
        with:
          branch: gh-pages  # The branch you want to deploy to
          folder: ./publish/wwwroot  # Folder containing your generated static files (adjust based on your project)
          token: ${{ secrets.GITHUB_TOKEN }}
