name: Build and Deploy .NET 8 Console App

on:
  push:
    branches:
      - master  # Trigger deployment when pushing to the master branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Use .NET 8 SDK

      - name: Restore dependencies
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet restore

      - name: Build the application
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet build --configuration Release

      - name: Publish the application
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet publish --configuration Release --output ./publish

          # Check if the publish directory exists
          if [ ! -d "./publish" ]; then
            echo "Error: Publish directory does not exist!"
            exit 1
          fi

      - name: List the contents of the publish directory
        run: |
          ls -R ./FirstAPI/publish

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # The branch you want to deploy to
          folder: FirstAPI/publish  # The folder containing the published files
          token: ${{ secrets.GH_TOKEN1 }}  # Use the correct GitHub token secret
          git-config-name: 'GitHub Actions'
          git-config-email: 'nilesh.nk171991@gmail.com'
          force: true  # Force push to resolve conflicts
