name: Build and Deploy .NET 8 Console App

on:
  push:
    branches:
      - master  # Trigger deployment when pushing to the master branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up .NET SDK
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  # Use .NET 8 SDK

      # Step 3: Restore dependencies
      - name: Restore dependencies
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet restore

      # Step 4: Build the application
      - name: Build the application
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet build --configuration Release

      # Step 5: Publish the application
      - name: Publish the application
        run: |
          cd FirstAPI  # Adjust this if your .csproj is in a different directory
          dotnet publish --configuration Release --output ./publish

          # Check if the publish directory exists
          if [ ! -d "./publish" ]; then
            echo "Error: Publish directory does not exist!"
            exit 1
          fi

      # Step 6: List the contents of the publish directory to verify output
      - name: List the contents of the publish directory
        run: |
          ls -R ./FirstAPI/publish

      # Step 7: Ensure the temporary deployment folder exists (for troubleshooting)
      - name: Ensure deployment folder exists
        run: |
          mkdir -p /home/runner/work/Projects/Projects/github-pages-deploy-action-temp-deployment-folder

      # Step 8: Deploy to GitHub Pages using the generated files
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: master  # The branch you want to deploy to
          folder: FirstAPI/publish  # The folder containing the published files
          token: ${{ secrets.GH_TOKEN }}  # Use the GitHub token secret (make sure this is configured in GitHub secrets)
          git-config-name: 'GitHub Actions'
          git-config-email: 'nilesh.nk171991@gmail.com'
          force: true  # Force push to resolve conflicts, if necessary
          commit-message: 'Deploying .NET 8 Console App 🚀'
          # Replace with your direct GitHub URL and token
          remote-url: "https://YOUR_GITHUB_USERNAME:${{ secrets.GH_TOKEN }}@github.com/imnilesh17/Projects.git"  # Use direct token for authentication
